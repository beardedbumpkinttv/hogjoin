<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H.O.G. Lobby Joiner</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            max-width: 600px;
            padding: 40px;
            border: 2px solid #777;
            background: #1b1b1b;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            letter-spacing: 3px;
        }

        .status {
            margin: 30px 0;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            border: 0;
            padding: 18px 32px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }

        .small {
            margin-top: 25px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🐗 H.O.G.</h1>
    <h2>HOTZONE OPERATIONS GROUP</h2>

    <div class="status">
        🔥 CRANKING YOUR HOG...
    </div>

    <p>
        Connecting you to your fellow HOGs in WARDOGS.
    </p>

    <button id="joinButton">
        🚁 CRANK THE HOG
    </button>

    <div class="small">
        Steam must be installed on this computer.<br><br>
        CRANK THE HOG. HOLD THE ZONE.
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);

    const app = params.get("app");
    const lobby = params.get("lobby");
    const player = params.get("player");

    const button = document.getElementById("joinButton");

    function joinHog() {

        if (!app || !lobby || !player) {
            alert("Missing H.O.G. lobby information.");
            return;
        }

        const steamURL =
            `steam://joinlobby/${app}/${lobby}/${player}`;

        window.location.href = steamURL;
    }

    button.addEventListener("click", joinHog);

    if (app && lobby && player) {
        setTimeout(joinHog, 1200);
    }
</script>

</body>
</html>
